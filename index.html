<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--main represents primary content of page, instead of div-->
    <main class="container">

        <h1>🌦️ Weather Report</h1>

        <button id="theme-toggle" type="button">
            🌙 Dark Mode
        </button>

        <form id="weather-form">

            <div class="search-row">
        
                <input
                    type="text"
                    id="city-input"
                    placeholder="Enter city..."
                    autocomplete="off"
                >
        
                <button id="search-btn" type="submit">
                    Search
                </button>
        
            </div>
        
            <button id="location-btn" type="button">
                📍 Use My Location
            </button>
            <button id="unit-toggle" type="button">
                °F
            </button>
        
        </form>
        <div id="loading" hidden>
            <div class="spinner"></div>
            <p>Loading weather...</p>
        </div>
        <p id="error-message"></p>

        <section id="weather-card">

            <h2 id="city-name">City</h2>
        
            <img
                id="weather-icon"
                src=""
                alt="Weather Icon"
                hidden
            >
        
            <h3 id="temperature">--°C</h3>
        
            <p id="description">
                Weather Description
            </p>
        
            <p class="temp-range">
                Min
                <span id="temp-min">--°C</span>
        
                •
        
                Max
                <span id="temp-max">--°C</span>
            </p>
        
            <div class="weather-details">
        
                <div class="detail-card">
                    <span>🌡 Feels Like</span>
                    <h3 id="feels-like">--°C</h3>
                </div>
        
                <div class="detail-card">
                    <span>💧 Humidity</span>
                    <h3 id="humidity">--%</h3>
                </div>
        
                <div class="detail-card">
                    <span>💨 Wind</span>
                    <h3 id="wind">-- km/h</h3>
                </div>
        
                <div class="detail-card">
                    <span>👁 Visibility</span>
                    <h3 id="visibility">-- km</h3>
                </div>
        
                <div class="detail-card">
                    <span>🌅 Sunrise</span>
                    <h3 id="sunrise">--:--</h3>
                </div>
        
                <div class="detail-card">
                    <span>🌇 Sunset</span>
                    <h3 id="sunset">--:--</h3>
                </div>
        
            </div>
        
            <div class="action-buttons">
        
                <button id="save-favorite">
                    
                    Save
                </button>
        
                <button id="copy-weather">
                     Copy Weather Details
                </button>
        
            </div>
        
            <p id="last-updated">
                Last Updated: --
            </p>
        
        </section>

        <div class="tabs">

            <button
                class="tab-btn active"
                data-tab="forecast"
            >
                Forecast
            </button>
        
            <button
                class="tab-btn"
                data-tab="favorites"
            >
                Favorites
            </button>
        
            <button
                class="tab-btn"
                data-tab="history"
            >
                History
            </button>
        
        </div>
        
        <div class="tab-content">
        
            <section
                id="forecast"
                class="tab-panel active"
            >
        
                <div id="forecast-container"></div>
        
            </section>
        
            <section
                id="favorites"
                class="tab-panel"
            >
        
                <div id="favorites-container"></div>
        
            </section>
        
            <section
                id="history"
                class="tab-panel"
            >
        
                <ul id="history-list"></ul>
        
            </section>
        
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>

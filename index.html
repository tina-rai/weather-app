<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--main represents primary content of page, instead of div-->
    <main class="container">

        <h1>🌦️ Weather Report</h1>

        <button id="theme-toggle" type="button">
            🌙 Dark Mode
        </button>

        <form id="weather-form">

            <div class="search-row">
        
                <input
                    type="text"
                    id="city-input"
                    placeholder="Enter city..."
                    autocomplete="off"
                >
        
                <button id="search-btn" type="submit">
                    Search
                </button>
        
            </div>
        
            <button id="location-btn" type="button">
                📍 Use My Location
            </button>
        
        </form>
        <p id="loading" hidden>
            Loading weather...
        </p>
        
        <p id="error-message"></p>

        <section id="weather-card">
            <h2 id="city-name">City</h2>

            <img
                id="weather-icon"
                src=""
                alt="Weather Icon"
                hidden
            >
            
            <h3 id="temperature">--°C</h3>

            <p class="temp-range">
                Min:
                <span id="temp-min">--°C</span>
                |
                Max:
                <span id="temp-max">--°C</span>
            </p>

            <p id="description">
                Weather description
            </p>

            <p>
                Feels Like:
                <span id="feels-like">--°C</span>
            </p>

            <p>
                Humidity:
                <span id="humidity">--%</span>
            </p>

            <p>
                Visibility:
                <span id="visibility">-- km</span>
            </p>

            <p>
                Wind:
                <span id="wind">-- km/h</span>
    
            </p>
            <p>
                🌅 Sunrise:
                <span id="sunrise">--:--</span>
            </p>
            
            <p>
                🌇 Sunset:
                <span id="sunset">--:--</span>
            </p>
            <p id="last-updated">
                Last Updated: --
            </p>

        </section>

        <section id="forecast">

            <h2>5-Day Forecast</h2>
        
            <div id="forecast-container">
        
            </div>
        
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>

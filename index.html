<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--main represents primary content of page, instead of div-->
    <main class="container">

        <div class="header">

            <div class="title-area">
        
                <h1>🌦 Weather</h1>
        
                <p class="subtitle">
                    Live weather around the world
                </p>
        
            </div>
        
        </div>

        <form id="weather-form">

            <div class="search-row">
        
                <input
                    type="text"
                    id="city-input"
                    placeholder="Enter city..."
                    autocomplete="off"
                >
        
                <button id="search-btn" type="submit">
                    Search
                </button>
        
            </div>
        
            <div class="controls">

                <button id="location-btn" type="button"> 
            
                    📍 Current Location
            
                </button>
            
                <button id="unit-toggle" type="button">
            
                    °F
            
                </button>


    <button id="theme-toggle" type="button">
        🌙 Dark Mode
    </button>
            
            </div>
        
        </form>
        <div id="loading" hidden>
            <div class="spinner"></div>
                </div>
        <p id="error-message"></p>

        <section id="weather-card">
            <div class="weather-main">

                <div class="weather-left">
            
            

            <h2 id="city-name">City</h2>
        
            <img
                id="weather-icon"
                src=""
                alt="Weather Icon"
                hidden
            >
        
            <h3 id="temperature">--°C</h3>
        
            <p id="description">
                Weather Description
            </p>
        
            <p class="temp-range">
                Min
                <span id="temp-min">--°C</span>
        
                •
        
                Max
                <span id="temp-max">--°C</span>
            </p>
        
            <div class="weather-details">
        
                <div class="detail-card">
                    <span>🌡 Feels Like</span>
                    <h3 id="feels-like">--°C</h3>
                </div>
        
                <div class="detail-card">
                    <span>💧 Humidity</span>
                    <h3 id="humidity">--%</h3>
                </div>
        
                <div class="detail-card">
                    <span>💨 Wind</span>
                    <h3 id="wind">-- km/h</h3>
                </div>
        
                <div class="detail-card">
                    <span>👁 Visibility</span>
                    <h3 id="visibility">-- km</h3>
                </div>
        
                <div class="detail-card">
                    <span>🌅 Sunrise</span>
                    <h3 id="sunrise">--:--</h3>
                </div>
        
                <div class="detail-card">
                    <span>🌇 Sunset</span>
                    <h3 id="sunset">--:--</h3>
                </div>
        
            </div>
        
            <div class="action-buttons">
        
                <button id="save-favorite" type="button">
                    
                    Save
                </button>
        
                <button id="copy-weather"type="button">
                     Copy Weather Details
                </button>
        
            </div>
        
            <p id="last-updated">
                Last Updated: 
            </p>
        </div>

        <div class="weather-right">
        </section>

        <div class="tabs">

            <button
                class="tab-btn active"
                data-tab="forecast"
            >
                Forecast
            </button>
        
            <button
                class="tab-btn"
                data-tab="favorites"
            >
                Favorites
            </button>
        
            <button
                class="tab-btn"
                data-tab="history"
            >
                History
            </button>
        
        </div>
        
        <div class="tab-content">
        
            <section
                id="forecast"
                class="tab-panel active"
            >
        
                <div id="forecast-container"></div>
        
            </section>
        
            <section
                id="favorites"
                class="tab-panel"
            >
        
                <div id="favorites-container"></div>
        
            </section>
        
            <section
                id="history"
                class="tab-panel"
            >
        
                <ul id="history-list"></ul>
        
            </section>
        
        </div>

    </main>

    <script src="js/dom.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
